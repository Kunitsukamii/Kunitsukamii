name: Build pixelated profile cards
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_card.py"
      - ".github/workflows/profile-card.yml"
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_profile_card.py
      - name: Commit generated cards if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dark.svg assets/profile-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update pixelated profile cards"
            git push
          fi
